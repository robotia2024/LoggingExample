name: PR build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- TRABAJO 1: DESCARGA CODIGO & INSTALLS & SINTAXIS VALIDATION & Build & testS & COVERAGE---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # ⚡ Optimiza el tiempo: guarda en caché las librerías para futuros builds

      - name: Instalar herramientas de empaquetado y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build
          pip install -r requirements.txt
          pip install flake8
#          pip install black

#      - name: Formatear código (Estilo Black) Si alguien olvida formatear su código, el Build falla
#        run: black --check .

      - name: Validar errores de sintaxis (Linter)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # AQUÍ SE PRODUCE EL COMPILADO REAL:
      # Este comando lee tu archivo 'setup.py' y empaqueta tu API en la carpeta 'dist/'
      - name: Compilar paquete (usa el setup.py con Setuptools para generar los wheels)
        run: python -m build

      # Guardamos el paquete compilado (.whl) como un artefacto de GitHub
      # Esto nos servirá para usarlo en el siguiente trabajo (Test) o para desplegarlo
      - name: Guardar paquete compilado
        uses: actions/upload-artifact@v4
        with:
          name: paquete-app-compilado
          path: dist/
          retention-days: 1

  # --- TRABAJO 2: TEST & COVERAGE ---
  test:
    runs-on: ubuntu-latest
    needs: build # 🛑 NO arranca si el trabajo de 'build' falla

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias proyecto y libraries de Testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validacion de la instalacion de la app
        run: |
          ls -l dist
          unzip dist/*.zip
          ls -l dist
          pip install dist/mi_super_app-1.0.0-py3-none-any.whl

      - name: Ejecutar Tests y Generar Cobertura
        # Indicamos que use pytest con cobertura sobre la carpeta de nuestra API (ej: 'app')
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=1

      - name: Subir Reporte de Cobertura a GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-api
          path: coverage.xml # El archivo generado en el paso anterior
          retention-days: 7 # Guarda el archivo por una semana

      - name: Comentario de Cobertura en el PR (Opcional)
        # Este "mini-robot" lee el reporte XML y pone un comentario bonito en tu Pull Request
        # fail_ci_if_error de Codecov falla si la subida a Codecov falla.
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Requiere configurarse si usas repositorios privados
          file: ./coverage.xml
          fail_ci_if_error: false

  # TRABAJO 3: Notificación si algo sale mal (Solo corre si los anteriores fallan)
  notify-failure:
    runs-on: ubuntu-latest
    needs: [ build, test ] # Espera a que los otros terminen
    if: failure() # ⚠️ IMPORTANTE: Solo se ejecuta si alguno de los anteriores falló
    steps:
      - name: ECHO alerta
        run: |
          echo "🚨 ALERTA: Las pruebas de Python han fallado en el commit ${{ github.sha }}."
          echo "Por favor, revisa los logs del flujo de trabajo."

#      - name: Enviar correo de alerta por fallo
